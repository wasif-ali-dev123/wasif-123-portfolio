<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="BNR Payroll Microservices — representative illustration">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.12"/><stop offset="1" stop-color="#14110e" stop-opacity="0"/></radialGradient>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#6b6157"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#14110e"/><rect width="1280" height="720" fill="url(#glow)"/>
  <rect x="64" y="56" width="1152" height="608" rx="20" fill="#1c1917" stroke="#2e2823"/>
  <rect x="64" y="56" width="1152" height="56" rx="20" fill="#211d19"/><rect x="64" y="92" width="1152" height="20" fill="#211d19"/>
  <circle cx="96" cy="84" r="6" fill="#3f3a34"/><circle cx="118" cy="84" r="6" fill="#3f3a34"/><circle cx="140" cy="84" r="6" fill="#3f3a34"/>
  <rect x="176" y="74" width="300" height="20" rx="10" fill="#14110e"/><text x="192" y="89" font-family="'SF Mono',monospace" font-size="13" fill="#a8a29e">bnr · payroll microservices</text>
  <text x="96" y="172" font-family="Georgia,serif" font-size="20" fill="#f5f1ea">Monolith → independently deployable services</text>
  <!-- monolith -->
  <rect x="96" y="220" width="180" height="360" rx="14" fill="#211d19" stroke="#2e2823" stroke-dasharray="5 5"/>
  <text x="186" y="250" text-anchor="middle" font-family="'SF Mono',monospace" font-size="12" fill="#a8a29e">legacy</text>
  <g fill="#2a2520"><rect x="120" y="272" width="132" height="40" rx="8"/><rect x="120" y="324" width="132" height="40" rx="8"/><rect x="120" y="376" width="132" height="40" rx="8"/><rect x="120" y="428" width="132" height="40" rx="8"/><rect x="120" y="480" width="132" height="40" rx="8"/></g>
  <!-- flow arrows -->
  <line x1="288" y1="400" x2="360" y2="400" stroke="#6b6157" stroke-width="2" marker-end="url(#arw)"/>
  <!-- services -->
  <g font-family="'SF Mono',monospace" font-size="13">
    <rect x="376" y="236" width="220" height="72" rx="12" fill="#211d19" stroke="url(#acc)"/><text x="400" y="270" fill="#f5f1ea">auth-svc</text><text x="400" y="292" fill="#a8a29e" font-size="11">OAuth · JWT</text>
    <rect x="376" y="332" width="220" height="72" rx="12" fill="#211d19" stroke="#2e2823"/><text x="400" y="366" fill="#f5f1ea">payroll-svc</text><text x="400" y="388" fill="#a8a29e" font-size="11">runs · schedules</text>
    <rect x="376" y="428" width="220" height="72" rx="12" fill="#211d19" stroke="#2e2823"/><text x="400" y="462" fill="#f5f1ea">payments-svc</text><text x="400" y="484" fill="#fbbf24" font-size="11">ACH · RTP</text>
  </g>
  <!-- queue -->
  <g>
    <line x1="596" y1="368" x2="676" y2="368" stroke="#6b6157" stroke-width="2" marker-end="url(#arw)"/>
    <rect x="684" y="316" width="180" height="120" rx="12" fill="#211d19" stroke="#2e2823"/><text x="708" y="346" font-family="'SF Mono',monospace" font-size="13" fill="#f5f1ea">queue</text><text x="708" y="366" font-family="'SF Mono',monospace" font-size="11" fill="#a8a29e">Sidekiq</text>
    <g fill="#fbbf24"><rect x="708" y="388" width="24" height="24" rx="5" opacity="0.9"/><rect x="740" y="388" width="24" height="24" rx="5" opacity="0.6"/><rect x="772" y="388" width="24" height="24" rx="5" opacity="0.35"/><rect x="804" y="388" width="24" height="24" rx="5" opacity="0.2"/></g>
  </g>
  <!-- db + integrations -->
  <line x1="864" y1="376" x2="944" y2="376" stroke="#6b6157" stroke-width="2" marker-end="url(#arw)"/>
  <g>
    <path d="M960 336 c0 -10 40 -10 40 0 v80 c0 10 -40 10 -40 0 z" fill="#211d19" stroke="#2e2823"/><ellipse cx="980" cy="336" rx="20" ry="7" fill="#2a2520" stroke="#2e2823"/><text x="1012" y="372" font-family="'SF Mono',monospace" font-size="12" fill="#a8a29e">PostgreSQL</text>
    <rect x="1012" y="392" width="150" height="52" rx="10" fill="#211d19" stroke="#2e2823"/><text x="1028" y="414" font-family="'SF Mono',monospace" font-size="11" fill="#a8a29e">financial</text><text x="1028" y="430" font-family="'SF Mono',monospace" font-size="11" fill="#a8a29e">integrations</text>
  </g>
  <!-- outcome chips -->
  <g font-family="'SF Mono',monospace" font-size="13">
    <rect x="376" y="524" width="260" height="48" rx="24" fill="#f59e0b" opacity="0.15"/><text x="404" y="553" fill="#fbbf24">−50% release cycle</text>
    <rect x="656" y="524" width="280" height="48" rx="24" fill="#211d19" stroke="#2e2823"/><text x="684" y="553" fill="#a8a29e">improved fault isolation</text>
  </g>
  <text x="1168" y="632" text-anchor="end" font-family="'SF Mono',monospace" font-size="11" fill="#5c554d" letter-spacing="2">REPRESENTATIVE</text>
</svg>
